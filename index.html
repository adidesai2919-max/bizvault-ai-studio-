
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BizVault AI Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:white;font-family:Arial,sans-serif;padding:20px}
header{margin:10px 0 25px}
.logo{font-size:27px;font-weight:800;color:#a78bfa}
.sub{color:#9ca3af;margin-top:8px}
.card{background:#1b2030;border:1px solid #34394b;border-radius:16px;padding:20px;margin-bottom:20px}
h2{font-size:22px}
label{display:block;margin:18px 0 8px;color:#cbd5e1}
input,select,button{width:100%;padding:15px;border-radius:10px;border:1px solid #394153;background:#101827;color:white;font-size:16px}
button{background:#765cf5;border:0;font-weight:bold;margin-top:22px}
button:active{opacity:.8}
#output{display:none;white-space:pre-wrap;line-height:1.7;font-size:14px}
.secondary{background:#34394b}
</style>
</head>
<body>
<header>
<div class="logo">✦ BIZVAULT AI</div>
<div class="sub">Your personal business documentary studio</div>
</header>

<div class="card">
<h2>Create your documentary 🎬</h2>

<label>Video topic</label>
<input id="topic" value="How DMart became successful">

<label>Language</label>
<select id="language">
<option>Hindi</option>
<option>English</option>
<option>Konkani</option>
</select>

<label>Video duration</label>
<select id="duration">
<option value="1">1 minute</option>
<option value="5">5 minutes</option>
<option value="10">10 minutes</option>
<option value="15" selected>15 minutes</option>
<option value="20">20 minutes</option>
</select>

<label>Visual style</label>
<select id="style">
<option>Cinematic realistic</option>
<option>3D animation</option>
<option>Documentary footage</option>
<option>Explainer graphics</option>
</select>

<button onclick="generate()">Create video plan →</button>
</div>

<div class="card" id="resultCard" style="display:none">
<h2>Your documentary plan</h2>
<div id="output"></div>
<button onclick="copyPlan()">Copy entire plan</button>
<button class="secondary" onclick="downloadPlan()">Download plan</button>
</div>

<script>
let finalPlan="";

function generate(){
const topic=document.getElementById("topic").value.trim();
const lang=document.getElementById("language").value;
const duration=Number(document.getElementById("duration").value);
const style=document.getElementById("style").value;

if(!topic){
alert("Please enter a video topic.");
return;
}

const sections=[
["HOOK","Start with a powerful question or surprising fact."],
["THE BEGINNING","Explain how the company, idea or story started."],
["THE PROBLEM","Show the challenge that needed to be solved."],
["THE BUSINESS MODEL","Explain how the business makes money."],
["THE GROWTH","Show the important decisions behind its growth."],
["THE STRATEGY","Explain its marketing, pricing and competition."],
["THE CHALLENGES","Discuss risks, failures and difficulties."],
["THE FUTURE","Explain what may happen next."]
];

let count=Math.max(3,Math.round(duration/1.8));
let plan="BIZVAULT AI STUDIO\n";
plan+="================================\n";
plan+="TOPIC: "+topic+"\n";
plan+="LANGUAGE: "+lang+"\n";
plan+="DURATION: "+duration+" minutes\n";
plan+="VISUAL STYLE: "+style+"\n\n";
plan+="DOCUMENTARY STRUCTURE\n";
plan+="================================\n";

for(let i=0;i<count;i++){
let s=sections[i%sections.length];
let start=Math.round(i*duration/count);
let end=Math.round((i+1)*duration/count);

plan+="\nSCENE "+(i+1)+" | "+start+"-"+end+" MINUTES\n";
plan+="SECTION: "+s[0]+"\n";
plan+="STORY: "+s[1]+"\n";
plan+="VISUAL: "+style+" footage showing "+topic+".\n";
plan+="CAMERA: Use moving shots, close-ups and smooth transitions.\n";
plan+="AUDIO: Narration, background music and suitable sound effects.\n";
}

plan+="\n================================\n";
plan+="RESEARCH CHECKLIST\n";
plan+="- Verify company history and dates.\n";
plan+="- Find reliable financial information.\n";
plan+="- Collect news articles and real footage.\n";
plan+="- Check every statistic before publishing.\n";
plan+="\nIMPORTANT: This is a planning tool. It does not yet generate video footage or AI narration.\n";

finalPlan=plan;
document.getElementById("output").textContent=plan;
document.getElementById("resultCard").style.display="block";
document.getElementById("resultCard").scrollIntoView({behavior:"smooth"});
}

function copyPlan(){
if(!finalPlan)return;
navigator.clipboard.writeText(finalPlan)
.then(()=>alert("Plan copied!"))
.catch(()=>alert("Please select and copy the plan manually."));
}

function downloadPlan(){
if(!finalPlan)return;
const blob=new Blob([finalPlan],{type:"text/plain"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="BizVault-Documentary-Plan.txt";
a.click();
URL.revokeObjectURL(url);
}
</script>
</body>
</html>
